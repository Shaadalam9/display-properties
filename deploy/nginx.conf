# nginx in front of the study on a TU/e virtual server (see deploy/README.md):
# HTTPS for participants, and no access log: the participant's IP address is only stored by
# app.js, with the responses, for finding duplicate participants.
# Copy to /etc/nginx/sites-available/display-properties, set server_name and the
# certificate paths, link it into sites-enabled and reload nginx.

server {
    listen 80;
    server_name study.example.tue.nl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name study.example.tue.nl;

    ssl_certificate     /etc/ssl/certs/study.pem;
    ssl_certificate_key /etc/ssl/private/study.key;

    # no request log: it would hold every participant's IP address a second time
    access_log off;
    # errors only, without client addresses where the format allows; keep short
    error_log /var/log/nginx/display-properties.error.log warn;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # the participant's address, for app.js (it trusts this header only from localhost)
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
